name: Test CI
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
  push:
    branches:
        - 'main'
        - 'dev'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v3
        - name: Set up Node.js
          uses: actions/setup-node@v3
          with:
            node-version: 20
        - name: Install dependencies
          run: npm ci
        - name: Lint code
          run: npm run lint
        - name: Run tests
          run: npm run test
        - name: Build code
          run: npm run build
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v3
        - name: Set up Node.js
          uses: actions/setup-node@v3
          with:
            node-version: 20
        - name: Install dependencies
          run: npm ci
        - name: Build project
          run: npm run build
        - name: Deploy
          run: | 
            echo "Deploying ..."
            echo "Environment: ${{ toJson(github) }}"